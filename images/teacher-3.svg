<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 320" fill="none">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f2444"/><stop offset="100%" stop-color="#1e4d8c"/></linearGradient>
    <linearGradient id="skin4" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#c07845"/><stop offset="100%" stop-color="#a05e30"/></linearGradient>
    <linearGradient id="abaya" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1a3c6e"/><stop offset="100%" stop-color="#0f2444"/></linearGradient>
    <radialGradient id="glow4" cx="50%" cy="40%" r="55%"><stop offset="0%" stop-color="#1a3c6e" stop-opacity="0.5"/><stop offset="100%" stop-color="#0f2444" stop-opacity="0"/></radialGradient>
  </defs>

  <rect width="280" height="320" fill="url(#bg4)"/>
  <ellipse cx="140" cy="110" rx="130" ry="130" fill="url(#glow4)"/>
  <g opacity="0.04" stroke="white" stroke-width="0.5">
    <line x1="0" y1="80" x2="280" y2="80"/><line x1="0" y1="160" x2="280" y2="160"/><line x1="0" y1="240" x2="280" y2="240"/>
    <line x1="70" y1="0" x2="70" y2="320"/><line x1="140" y1="0" x2="140" y2="320"/><line x1="210" y1="0" x2="210" y2="320"/>
  </g>

  <!-- Body abaya/professional dress -->
  <rect x="56" y="206" width="168" height="140" rx="16" fill="url(#abaya)"/>
  <!-- Dupatta/scarf drape over shoulders -->
  <path d="M56 210 Q80 220 140 215 Q200 220 224 210 L224 240 Q200 248 140 244 Q80 248 56 240Z" fill="#2554a0" opacity="0.5"/>

  <!-- Hijab -->
  <ellipse cx="140" cy="162" rx="60" ry="66" fill="#1a3c6e"/>
  <!-- Face -->
  <ellipse cx="140" cy="168" rx="42" ry="46" fill="url(#skin4)"/>
  <!-- Hijab drape sides -->
  <path d="M80 162 Q82 196 92 220 Q114 230 140 232 Q166 230 188 220 Q198 196 200 162" fill="#0f2444"/>
  <!-- Hijab top -->
  <path d="M80 158 Q84 128 140 124 Q196 128 200 158 Q196 132 140 128 Q84 132 80 158Z" fill="#0f2444"/>

  <!-- Eyes large expressive -->
  <ellipse cx="126" cy="163" rx="7" ry="8" fill="#1a1a1a"/>
  <ellipse cx="154" cy="163" rx="7" ry="8" fill="#1a1a1a"/>
  <!-- Iris colour (hazel) -->
  <ellipse cx="126" cy="163" rx="5" ry="5.5" fill="#5c3d1e"/>
  <ellipse cx="154" cy="163" rx="5" ry="5.5" fill="#5c3d1e"/>
  <!-- Pupils -->
  <ellipse cx="126" cy="163" rx="3" ry="3.5" fill="#0a0500"/>
  <ellipse cx="154" cy="163" rx="3" ry="3.5" fill="#0a0500"/>
  <circle cx="128" cy="161" r="1.8" fill="white"/>
  <circle cx="156" cy="161" r="1.8" fill="white"/>
  <!-- Eyelashes top -->
  <path d="M119 155 Q126 152 133 155" stroke="#0a0500" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M147 155 Q154 152 161 155" stroke="#0a0500" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Eyebrows arched -->
  <path d="M118 149 Q126 144 134 149" stroke="#0a0500" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M146 149 Q154 144 162 149" stroke="#0a0500" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <!-- Nose refined -->
  <path d="M137 174 Q140 180 143 174" stroke="rgba(0,0,0,0.2)" stroke-width="1.3" fill="none"/>
  <!-- Bright friendly smile -->
  <path d="M129 189 Q140 199 151 189" stroke="rgba(0,0,0,0.28)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Lips hint -->
  <path d="M133 194 Q140 197 147 194" stroke="#b06840" stroke-width="1" fill="rgba(176,104,64,0.15)"/>

  <!-- Arms -->
  <rect x="44" y="218" width="30" height="64" rx="10" fill="url(#abaya)"/>
  <rect x="206" y="218" width="30" height="64" rx="10" fill="url(#abaya)"/>
  <ellipse cx="59" cy="286" rx="16" ry="11" fill="url(#skin4)"/>
  <ellipse cx="221" cy="286" rx="16" ry="11" fill="url(#skin4)"/>
  <!-- Files/papers in right hand -->
  <rect x="210" y="264" width="38" height="48" rx="5" fill="white" opacity="0.92"/>
  <rect x="214" y="268" width="28" height="4" rx="2" fill="#1a3c6e" opacity="0.3"/>
  <rect x="214" y="275" width="22" height="3" rx="1.5" fill="#9ca3af"/>
  <rect x="214" y="281" width="26" height="3" rx="1.5" fill="#9ca3af"/>
  <rect x="214" y="287" width="18" height="3" rx="1.5" fill="#e8a020" opacity="0.6"/>
  <rect x="214" y="293" width="24" height="3" rx="1.5" fill="#9ca3af"/>

  <!-- Name badge -->
  <rect x="100" y="296" width="80" height="28" rx="8" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="140" y="308" text-anchor="middle" font-size="9" fill="white" font-family="Inter,sans-serif" font-weight="700">Asma Bibi</text>
  <text x="140" y="318" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.6)" font-family="Inter,sans-serif">Typing Instructor</text>
</svg>
