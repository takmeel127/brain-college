<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f2444"/><stop offset="100%" stop-color="#1a3c6e"/></linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#d4956a"/><stop offset="100%" stop-color="#c07845"/></linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f2444"/><stop offset="100%" stop-color="#1a3c6e"/></linearGradient>
    <radialGradient id="bgcirc" cx="50%" cy="40%" r="55%"><stop offset="0%" stop-color="#1a3c6e" stop-opacity="0.5"/><stop offset="100%" stop-color="#0f2444" stop-opacity="0"/></radialGradient>
  </defs>

  <rect width="280" height="320" fill="url(#bg)"/>
  <ellipse cx="140" cy="120" rx="140" ry="140" fill="url(#bgcirc)"/>
  <!-- Grid -->
  <g opacity="0.04" stroke="white" stroke-width="0.5">
    <line x1="0" y1="80" x2="280" y2="80"/><line x1="0" y1="160" x2="280" y2="160"/><line x1="0" y1="240" x2="280" y2="240"/>
    <line x1="70" y1="0" x2="70" y2="320"/><line x1="140" y1="0" x2="140" y2="320"/><line x1="210" y1="0" x2="210" y2="320"/>
  </g>

  <!-- Body/suit -->
  <rect x="60" y="200" width="160" height="140" rx="16" fill="url(#suit)"/>
  <!-- Shirt white -->
  <rect x="110" y="200" width="60" height="90" rx="8" fill="white" opacity="0.9"/>
  <!-- Jacket lapels -->
  <path d="M60 200 L82 200 L110 260 L60 280Z" fill="#0a1628"/>
  <path d="M220 200 L198 200 L170 260 L220 280Z" fill="#0a1628"/>
  <!-- Tie gold -->
  <path d="M134 202 L146 202 L148 260 L140 268 L132 260Z" fill="#e8a020"/>
  <path d="M134 202 L140 194 L146 202Z" fill="#c07010"/>
  <!-- Shirt buttons -->
  <circle cx="140" cy="220" r="2.5" fill="#e5e7eb"/>
  <circle cx="140" cy="235" r="2.5" fill="#e5e7eb"/>
  <circle cx="140" cy="250" r="2.5" fill="#e5e7eb"/>

  <!-- Neck -->
  <rect x="124" y="182" width="32" height="24" rx="10" fill="url(#skin)"/>

  <!-- Head -->
  <ellipse cx="140" cy="152" rx="54" ry="60" fill="url(#skin)"/>

  <!-- Ear -->
  <ellipse cx="86" cy="158" rx="8" ry="12" fill="url(#skin)"/>
  <ellipse cx="194" cy="158" rx="8" ry="12" fill="url(#skin)"/>
  <ellipse cx="86" cy="158" rx="5" ry="8" fill="#c07845" opacity="0.5"/>
  <ellipse cx="194" cy="158" rx="5" ry="8" fill="#c07845" opacity="0.5"/>

  <!-- Hair black neat -->
  <path d="M86 134 Q90 102 140 98 Q190 102 194 134 Q190 106 140 102 Q90 106 86 134Z" fill="#1a0800"/>
  <path d="M86 134 Q84 148 86 156" fill="#1a0800"/>
  <path d="M194 134 Q196 148 194 156" fill="#1a0800"/>

  <!-- Glasses professional -->
  <rect x="108" y="144" width="26" height="20" rx="6" fill="none" stroke="#2d1a0a" stroke-width="2"/>
  <rect x="146" y="144" width="26" height="20" rx="6" fill="none" stroke="#2d1a0a" stroke-width="2"/>
  <line x1="134" y1="154" x2="146" y2="154" stroke="#2d1a0a" stroke-width="2"/>
  <line x1="86" y1="154" x2="108" y2="154" stroke="#2d1a0a" stroke-width="1.5"/>
  <line x1="172" y1="154" x2="194" y2="154" stroke="#2d1a0a" stroke-width="1.5"/>
  <!-- Lenses tint -->
  <rect x="109" y="145" width="24" height="18" rx="5" fill="rgba(37,84,160,0.08)"/>
  <rect x="147" y="145" width="24" height="18" rx="5" fill="rgba(37,84,160,0.08)"/>

  <!-- Eyes -->
  <ellipse cx="121" cy="154" rx="5" ry="5.5" fill="#1a1a1a"/>
  <ellipse cx="159" cy="154" rx="5" ry="5.5" fill="#1a1a1a"/>
  <circle cx="123" cy="152" r="2" fill="white"/>
  <circle cx="161" cy="152" r="2" fill="white"/>

  <!-- Eyebrows neat -->
  <path d="M110 138 Q121 133 132 138" stroke="#1a0800" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M148 138 Q159 133 170 138" stroke="#1a0800" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M136 165 Q140 172 144 165" stroke="rgba(0,0,0,0.25)" stroke-width="1.5" fill="none"/>

  <!-- Confident smile -->
  <path d="M126 178 Q140 187 154 178" stroke="rgba(0,0,0,0.3)" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Mustache -->
  <path d="M130 173 Q135 170 140 173 Q145 170 150 173" stroke="#1a0800" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- Arms -->
  <rect x="46" y="210" width="28" height="60" rx="10" fill="url(#suit)"/>
  <rect x="206" y="210" width="28" height="60" rx="10" fill="url(#suit)"/>
  <!-- Hands -->
  <ellipse cx="60" cy="275" rx="15" ry="11" fill="url(#skin)"/>
  <ellipse cx="220" cy="275" rx="15" ry="11" fill="url(#skin)"/>
  <!-- Book in right hand -->
  <rect x="228" y="256" width="28" height="36" rx="4" fill="#e8a020"/>
  <rect x="232" y="260" width="20" height="28" rx="2" fill="#f5bc50"/>
  <rect x="234" y="264" width="14" height="3" rx="1" fill="#0f2444" opacity="0.4"/>
  <rect x="234" y="270" width="10" height="3" rx="1" fill="#0f2444" opacity="0.3"/>

  <!-- Name badge -->
  <rect x="100" y="296" width="80" height="28" rx="8" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="140" y="308" text-anchor="middle" font-size="9" fill="white" font-family="Inter,sans-serif" font-weight="700">M. Shahid</text>
  <text x="140" y="318" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.6)" font-family="Inter,sans-serif">Computer Instructor</text>
</svg>
