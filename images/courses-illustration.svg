<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="c1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3c6e"/>
      <stop offset="100%" style="stop-color:#2554a0"/>
    </linearGradient>
    <linearGradient id="c2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8a020"/>
      <stop offset="100%" style="stop-color:#f5bc50"/>
    </linearGradient>
    <filter id="cs" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f2444" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Monitor -->
  <g filter="url(#cs)">
    <rect x="80" y="40" width="240" height="160" rx="12" fill="url(#c1)"/>
    <rect x="90" y="50" width="220" height="140" rx="8" fill="#0a1628"/>
    <!-- Screen content -->
    <rect x="100" y="62" width="80" height="8" rx="4" fill="#e8a020" opacity="0.9"/>
    <rect x="100" y="76" width="160" height="5" rx="2.5" fill="rgba(255,255,255,0.2)"/>
    <rect x="100" y="87" width="130" height="5" rx="2.5" fill="rgba(255,255,255,0.12)"/>
    <rect x="100" y="98" width="180" height="5" rx="2.5" fill="rgba(37,84,160,0.8)"/>
    <rect x="100" y="109" width="110" height="5" rx="2.5" fill="rgba(255,255,255,0.15)"/>

    <!-- Chart bars -->
    <rect x="110" y="140" width="18" height="40" rx="3" fill="#e8a020" opacity="0.8"/>
    <rect x="135" y="128" width="18" height="52" rx="3" fill="#2554a0" opacity="0.9"/>
    <rect x="160" y="148" width="18" height="32" rx="3" fill="#e8a020" opacity="0.6"/>
    <rect x="185" y="135" width="18" height="45" rx="3" fill="#2554a0" opacity="0.7"/>
    <rect x="210" y="120" width="18" height="60" rx="3" fill="#e8a020" opacity="0.9"/>
    <rect x="235" y="145" width="18" height="35" rx="3" fill="#2554a0" opacity="0.8"/>
    <rect x="260" y="132" width="18" height="48" rx="3" fill="#e8a020" opacity="0.7"/>

    <!-- Stand -->
    <rect x="185" y="200" width="30" height="20" rx="4" fill="url(#c1)" opacity="0.8"/>
    <rect x="160" y="218" width="80" height="10" rx="5" fill="#0f2444" opacity="0.6"/>
  </g>

  <!-- Floating icons -->
  <g filter="url(#cs)">
    <rect x="20" y="70" width="56" height="56" rx="14" fill="white"/>
    <text x="48" y="104" text-anchor="middle" font-size="28">💻</text>
  </g>
  <g filter="url(#cs)">
    <rect x="324" y="60" width="56" height="56" rx="14" fill="white"/>
    <text x="352" y="94" text-anchor="middle" font-size="28">🎓</text>
  </g>
  <g filter="url(#cs)">
    <rect x="20" y="180" width="56" height="56" rx="14" fill="white"/>
    <text x="48" y="214" text-anchor="middle" font-size="28">📜</text>
  </g>
  <g filter="url(#cs)">
    <rect x="324" y="170" width="56" height="56" rx="14" fill="white"/>
    <text x="352" y="204" text-anchor="middle" font-size="28">⌨️</text>
  </g>

  <!-- Decorative -->
  <circle cx="60" cy="250" r="20" fill="none" stroke="rgba(232,160,32,0.2)" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="340" cy="250" r="15" fill="rgba(37,84,160,0.1)"/>
  <circle cx="200" cy="280" r="8" fill="rgba(232,160,32,0.12)"/>
</svg>
