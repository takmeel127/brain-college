<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" fill="none">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3c6e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2554a0;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="screen1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2444;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a3c6e;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8a020;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f5bc50;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2554a0;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#e8a020;stop-opacity:0.1"/>
    </linearGradient>
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f2444" flood-opacity="0.4"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="radial1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#2554a0;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#0f2444;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background glow -->
  <ellipse cx="300" cy="250" rx="280" ry="230" fill="url(#radial1)" opacity="0.5"/>

  <!-- Main laptop/computer body -->
  <g filter="url(#shadow1)">
    <!-- Laptop base -->
    <rect x="120" y="310" width="360" height="18" rx="4" fill="url(#bg1)"/>
    <rect x="100" y="325" width="400" height="12" rx="6" fill="#0f2444"/>
    <!-- Screen back -->
    <rect x="150" y="120" width="300" height="200" rx="16" fill="url(#bg1)"/>
    <!-- Screen bezel -->
    <rect x="160" y="130" width="280" height="180" rx="10" fill="#0a1628"/>
    <!-- Screen display -->
    <rect x="168" y="138" width="264" height="164" rx="6" fill="url(#screen1)"/>

    <!-- Screen content - Code lines -->
    <rect x="180" y="152" width="120" height="6" rx="3" fill="#e8a020" opacity="0.9"/>
    <rect x="180" y="165" width="180" height="4" rx="2" fill="rgba(255,255,255,0.25)"/>
    <rect x="180" y="175" width="150" height="4" rx="2" fill="rgba(255,255,255,0.15)"/>
    <rect x="180" y="185" width="200" height="4" rx="2" fill="rgba(255,255,255,0.20)"/>
    <rect x="180" y="195" width="100" height="4" rx="2" fill="#e8a020" opacity="0.6"/>
    <rect x="180" y="205" width="170" height="4" rx="2" fill="rgba(255,255,255,0.15)"/>
    <rect x="180" y="215" width="140" height="4" rx="2" fill="rgba(255,255,255,0.25)"/>
    <rect x="180" y="225" width="190" height="4" rx="2" fill="#2554a0" opacity="0.8"/>
    <rect x="180" y="235" width="80" height="4" rx="2" fill="rgba(255,255,255,0.15)"/>
    <rect x="180" y="245" width="160" height="4" rx="2" fill="#e8a020" opacity="0.5"/>
    <rect x="180" y="258" width="220" height="4" rx="2" fill="rgba(255,255,255,0.10)"/>
    <rect x="180" y="268" width="110" height="4" rx="2" fill="rgba(255,255,255,0.20)"/>
    <rect x="180" y="278" width="180" height="4" rx="2" fill="#2554a0" opacity="0.6"/>

    <!-- Screen progress bar -->
    <rect x="180" y="292" width="240" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
    <rect x="180" y="292" width="160" height="6" rx="3" fill="url(#accent1)"/>

    <!-- Camera dot -->
    <circle cx="300" cy="134" r="3" fill="#2554a0"/>

    <!-- Laptop keyboard area -->
    <rect x="155" y="310" width="290" height="8" rx="4" fill="#0f2444"/>
    <!-- Keyboard keys rows -->
    <rect x="168" y="312" width="264" height="3" rx="1.5" fill="rgba(255,255,255,0.08)"/>
  </g>

  <!-- Floating card 1 - Certificate -->
  <g transform="translate(50, 160)" opacity="0.95" filter="url(#shadow1)">
    <rect width="130" height="70" rx="12" fill="white"/>
    <rect x="10" y="12" width="28" height="28" rx="8" fill="rgba(232,160,32,0.15)"/>
    <text x="24" y="30" text-anchor="middle" font-size="16" fill="#e8a020">🏆</text>
    <rect x="46" y="14" width="72" height="6" rx="3" fill="#1a3c6e"/>
    <rect x="46" y="26" width="55" height="4" rx="2" fill="#9ca3af"/>
    <rect x="10" y="48" width="110" height="12" rx="6" fill="rgba(16,185,129,0.12)"/>
    <text x="64" y="58" text-anchor="middle" font-size="8" fill="#10b981" font-weight="600">✓ Certified</text>
  </g>

  <!-- Floating card 2 - Students -->
  <g transform="translate(420, 130)" opacity="0.95" filter="url(#shadow1)">
    <rect width="130" height="70" rx="12" fill="white"/>
    <rect x="10" y="12" width="28" height="28" rx="8" fill="rgba(26,60,110,0.10)"/>
    <text x="24" y="30" text-anchor="middle" font-size="16" fill="#1a3c6e">👨‍🎓</text>
    <rect x="46" y="14" width="50" height="6" rx="3" fill="#1a3c6e"/>
    <rect x="46" y="26" width="70" height="4" rx="2" fill="#9ca3af"/>
    <text x="46" y="52" font-size="18" fill="#1a3c6e" font-weight="900">5000+</text>
    <text x="46" y="62" font-size="8" fill="#9ca3af">Students Trained</text>
  </g>

  <!-- Floating card 3 - Experience -->
  <g transform="translate(430, 260)" opacity="0.95" filter="url(#shadow1)">
    <rect width="120" height="60" rx="12" fill="white"/>
    <rect x="10" y="10" width="24" height="24" rx="7" fill="rgba(232,160,32,0.12)"/>
    <text x="22" y="26" text-anchor="middle" font-size="14" fill="#e8a020">⭐</text>
    <text x="42" y="24" font-size="14" fill="#1a3c6e" font-weight="900">15+</text>
    <text x="42" y="36" font-size="8" fill="#6b7280">Years Experience</text>
    <rect x="10" y="42" width="100" height="8" rx="4" fill="rgba(232,160,32,0.10)"/>
    <rect x="10" y="42" width="75" height="8" rx="4" fill="rgba(232,160,32,0.4)"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="80" cy="80" r="30" fill="none" stroke="rgba(232,160,32,0.2)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="520" cy="420" r="25" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="540" cy="100" r="15" fill="rgba(232,160,32,0.08)"/>
  <circle cx="60" cy="380" r="20" fill="rgba(37,84,160,0.10)"/>

  <!-- Floating dots -->
  <circle cx="100" cy="280" r="4" fill="#e8a020" opacity="0.6"/>
  <circle cx="490" cy="200" r="3" fill="rgba(255,255,255,0.3)"/>
  <circle cx="130" cy="400" r="5" fill="rgba(37,84,160,0.4)"/>
  <circle cx="470" cy="380" r="4" fill="#e8a020" opacity="0.4"/>
  <circle cx="200" cy="450" r="3" fill="rgba(255,255,255,0.2)"/>
  <circle cx="380" cy="460" r="5" fill="rgba(37,84,160,0.3)"/>

  <!-- Stars/sparkles -->
  <g opacity="0.7">
    <path d="M510 60 L513 68 L521 68 L515 73 L517 81 L510 76 L503 81 L505 73 L499 68 L507 68 Z" fill="#e8a020" opacity="0.5"/>
    <path d="M75 120 L77 126 L83 126 L78 130 L80 136 L75 132 L70 136 L72 130 L67 126 L73 126 Z" fill="rgba(255,255,255,0.4)" transform="scale(0.6) translate(50,50)"/>
  </g>

  <!-- Connection lines (subtle) -->
  <line x1="180" y1="195" x2="115" y2="195" stroke="rgba(232,160,32,0.15)" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="432" y1="195" x2="420" y2="195" stroke="rgba(232,160,32,0.15)" stroke-width="1" stroke-dasharray="3 3"/>
</svg>
