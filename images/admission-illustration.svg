<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" fill="none">
  <defs>
    <linearGradient id="ai1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3c6e"/>
      <stop offset="100%" style="stop-color:#2554a0"/>
    </linearGradient>
    <filter id="as" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f2444" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Form card -->
  <g filter="url(#as)">
    <rect x="80" y="40" width="240" height="240" rx="16" fill="white"/>
    <!-- Header -->
    <rect x="80" y="40" width="240" height="50" rx="16" fill="url(#ai1)"/>
    <rect x="80" y="70" width="240" height="20" fill="url(#ai1)"/>
    <text x="200" y="70" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.9)" font-weight="700">ADMISSION FORM 2026</text>
    <text x="200" y="84" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.6)">The Brain College Bhakkar</text>

    <!-- Form fields -->
    <rect x="100" y="108" width="200" height="16" rx="6" fill="#f3f4f6"/>
    <rect x="100" y="108" width="60" height="16" rx="6" fill="#e5e7eb"/>
    <rect x="100" y="130" width="200" height="16" rx="6" fill="#f3f4f6"/>
    <rect x="100" y="152" width="200" height="16" rx="6" fill="#f3f4f6"/>
    <rect x="100" y="174" width="95" height="16" rx="6" fill="#f3f4f6"/>
    <rect x="205" y="174" width="95" height="16" rx="6" fill="#f3f4f6"/>
    <rect x="100" y="196" width="200" height="16" rx="6" fill="#f3f4f6"/>
    <rect x="100" y="218" width="200" height="16" rx="6" fill="#f3f4f6"/>

    <!-- Submit button -->
    <rect x="110" y="244" width="180" height="24" rx="12" fill="url(#ai1)"/>
    <text x="200" y="260" text-anchor="middle" font-size="9" fill="white" font-weight="700">Submit Application</text>

    <!-- Field labels -->
    <text x="104" y="107" font-size="7" fill="#9ca3af">Full Name</text>
    <text x="104" y="129" font-size="7" fill="#9ca3af">Father's Name</text>
    <text x="104" y="151" font-size="7" fill="#9ca3af">Phone Number</text>
    <text x="104" y="173" font-size="7" fill="#9ca3af">Course</text>
    <text x="104" y="195" font-size="7" fill="#9ca3af">Address</text>
    <text x="104" y="217" font-size="7" fill="#9ca3af">Qualification</text>
  </g>

  <!-- ID Card floating -->
  <g filter="url(#as)" transform="translate(10, 140)">
    <rect width="100" height="70" rx="10" fill="url(#ai1)"/>
    <circle cx="20" cy="28" r="14" fill="rgba(255,255,255,0.2)"/>
    <text x="20" y="32" text-anchor="middle" font-size="14" fill="white">👤</text>
    <rect x="40" y="18" width="52" height="5" rx="2.5" fill="rgba(255,255,255,0.6)"/>
    <rect x="40" y="28" width="40" height="4" rx="2" fill="rgba(255,255,255,0.35)"/>
    <rect x="8" y="50" width="84" height="12" rx="4" fill="rgba(232,160,32,0.4)"/>
    <text x="50" y="59" text-anchor="middle" font-size="7" fill="white" font-weight="600">BRAIN-2026-XXXXX</text>
  </g>

  <!-- Success check -->
  <g filter="url(#as)" transform="translate(290, 100)">
    <circle cx="50" cy="50" r="40" fill="rgba(16,185,129,0.1)" stroke="#10b981" stroke-width="2"/>
    <path d="M32 50 L44 62 L68 38" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="50" y="104" text-anchor="middle" font-size="8" fill="#10b981" font-weight="600">Approved!</text>
  </g>

  <!-- Decorative dots -->
  <circle cx="40" cy="80" r="5" fill="rgba(232,160,32,0.3)"/>
  <circle cx="360" cy="260" r="7" fill="rgba(37,84,160,0.15)"/>
  <circle cx="370" cy="40" r="4" fill="rgba(232,160,32,0.2)"/>
</svg>
