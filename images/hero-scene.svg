    <rect x="98" y="248" width="14" height="64" rx="3" fill="#2554a0" opacity="0.9"/>
    <rect x="118" y="272" width="14" height="40" rx="3" fill="#e8a020" opacity="0.6"/>
    <rect x="138" y="255" width="14" height="57" rx="3" fill="#2554a0" opacity="0.7"/>
    <rect x="158" y="240" width="14" height="72" rx="3" fill="#10b981" opacity="0.8"/>
