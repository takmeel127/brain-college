    <ellipse cx="162" cy="272" rx="3.5" ry="4" fill="#1a1a1a"/>
    <circle cx="149.5" cy="271" r="1.2" fill="white"/>
    <circle cx="163.5" cy="271" r="1.2" fill="white"/>
    <!-- Eyebrows -->
    <path d="M144 266 Q148 263 152 266" stroke="#2d1a0a" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M158 266 Q162 263 166 266" stroke="#2d1a0a" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <!-- Nose -->
    <path d="M153 276 Q155 280 157 276" stroke="rgba(0,0,0,0.25)" stroke-width="1.2" fill="none"/>
    <!-- Smile -->
    <path d="M148 284 Q155 289 162 284" stroke="rgba(0,0,0,0.3)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Arms -->
