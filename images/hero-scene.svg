    <rect x="268" y="218" width="140" height="4" rx="2" fill="rgba(255,255,255,0.22)"/>
    <rect x="278" y="228" width="90" height="4" rx="2" fill="#7c3aed" opacity="0.8"/>
    <rect x="278" y="238" width="120" height="4" rx="2" fill="rgba(255,255,255,0.15)"/>
    <rect x="278" y="248" width="60" height="4" rx="2" fill="#10b981" opacity="0.8"/>
    <rect x="278" y="258" width="100" height="4" rx="2" fill="rgba(255,255,255,0.15)"/>
    <rect x="268" y="268" width="45" height="4" rx="2" fill="#e8a020" opacity="0.7"/>
    <rect x="268" y="278" width="130" height="4" rx="2" fill="rgba(255,255,255,0.12)"/>
    <rect x="278" y="288" width="80" height="4" rx="2" fill="#2554a0" opacity="0.9"/>
    <rect x="278" y="298" width="110" height="4" rx="2" fill="rgba(255,255,255,0.18)"/>
    <rect x="268" y="308" width="150" height="4" rx="2" fill="#10b981" opacity="0.5"/>
    <!-- Cursor blink -->
    <rect x="268" y="318" width="3" height="12" rx="1" fill="#f5bc50"/>

    <!-- Monitor stand -->
    <rect x="345" y="350" width="30" height="22" rx="3" fill="#0d1b2e"/>
    <rect x="330" y="370" width="60" height="10" rx="5" fill="#0a1628"/>

    <!-- Camera dot -->
    <circle cx="360" cy="172" r="3" fill="#1a3c6e"/>
