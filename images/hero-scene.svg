    <circle cx="284" cy="187" r="4" fill="#f59e0b" opacity="0.8"/>
    <circle cx="298" cy="187" r="4" fill="#10b981" opacity="0.8"/>
    <rect x="310" y="183" width="80" height="8" rx="4" fill="rgba(255,255,255,0.08)"/>

