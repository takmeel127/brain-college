    <rect x="504" y="260" width="30" height="6" rx="2" fill="rgba(255,255,255,0.20)"/>
    <rect x="504" y="272" width="50" height="6" rx="2" fill="rgba(255,255,255,0.12)"/>
    <rect x="535" y="236" width="25" height="6" rx="2" fill="#e8a020" opacity="0.5"/>
    <rect x="535" y="248" width="35" height="6" rx="2" fill="#e8a020" opacity="0.4"/>
    <rect x="535" y="260" width="20" height="6" rx="2" fill="#10b981" opacity="0.6"/>
    <rect x="535" y="272" width="30" height="6" rx="2" fill="#e8a020" opacity="0.35"/>
    <!-- Mini pie chart area -->
    <circle cx="570" cy="296" r="16" fill="none" stroke="#e8a020" stroke-width="4" stroke-dasharray="35 65" stroke-dashoffset="25" opacity="0.8"/>
    <circle cx="570" cy="296" r="16" fill="none" stroke="#2554a0" stroke-width="4" stroke-dasharray="25 75" stroke-dashoffset="-40" opacity="0.8"/>
    <circle cx="570" cy="296" r="16" fill="none" stroke="#10b981" stroke-width="4" stroke-dasharray="15 85" stroke-dashoffset="-65" opacity="0.8"/>
