<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="60%" stop-color="#0f2444"/>
      <stop offset="100%" stop-color="#1a3c6e"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f2444"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b2e"/>
      <stop offset="100%" stop-color="#1a3c6e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8a020"/>
      <stop offset="100%" stop-color="#f5bc50"/>
    </linearGradient>
    <linearGradient id="person" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4956a"/>
      <stop offset="100%" stop-color="#c07845"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a3c6e"/>
      <stop offset="100%" stop-color="#2554a0"/>
    </linearGradient>
    <linearGradient id="girlperson" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4956a"/>
      <stop offset="100%" stop-color="#b87040"/>
    </linearGradient>
    <linearGradient id="girlshirt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2554a0"/>
      <stop offset="100%" stop-color="#1e4d8c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#050d1a" flood-opacity="0.5"/>
    </filter>
    <filter id="cardshadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#050d1a" flood-opacity="0.3"/>
    </filter>
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2554a0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f2444" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="floorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a3c6e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a1628" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="720" height="540" fill="url(#bg)"/>

  <!-- Background grid lines -->
  <g opacity="0.04" stroke="white" stroke-width="0.8">
    <line x1="0" y1="90" x2="720" y2="90"/>
    <line x1="0" y1="180" x2="720" y2="180"/>
    <line x1="0" y1="270" x2="720" y2="270"/>
    <line x1="0" y1="360" x2="720" y2="360"/>
    <line x1="0" y1="450" x2="720" y2="450"/>
    <line x1="90" y1="0" x2="90" y2="540"/>
    <line x1="180" y1="0" x2="180" y2="540"/>
    <line x1="270" y1="0" x2="270" y2="540"/>
    <line x1="360" y1="0" x2="360" y2="540"/>
    <line x1="450" y1="0" x2="450" y2="540"/>
    <line x1="540" y1="0" x2="540" y2="540"/>
    <line x1="630" y1="0" x2="630" y2="540"/>
  </g>

  <!-- Background orb glow -->
