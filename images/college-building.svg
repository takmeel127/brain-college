<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0a1628"/><stop offset="60%" stop-color="#0f2444"/><stop offset="100%" stop-color="#1a3c6e"/></linearGradient>
    <linearGradient id="build" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a3c6e"/><stop offset="100%" stop-color="#0f2444"/></linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0a1628"/><stop offset="100%" stop-color="#0f2444"/></linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a3c6e"/><stop offset="100%" stop-color="#0a1628"/></linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#e8a020" stop-opacity="0.4"/><stop offset="100%" stop-color="#f5bc50" stop-opacity="0.2"/></linearGradient>
    <linearGradient id="sign" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#e8a020"/><stop offset="100%" stop-color="#f5bc50"/></linearGradient>
    <filter id="sh6" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#050d1a" flood-opacity="0.5"/></filter>
    <radialGradient id="sunGlow" cx="50%" cy="30%" r="40%"><stop offset="0%" stop-color="#e8a020" stop-opacity="0.15"/><stop offset="100%" stop-color="#0a1628" stop-opacity="0"/></radialGradient>
  </defs>

  <!-- Sky background -->
  <rect width="800" height="480" fill="url(#sky)"/>
  <!-- Sun glow effect -->
  <ellipse cx="400" cy="80" rx="300" ry="200" fill="url(#sunGlow)"/>
  <!-- Stars -->
  <circle cx="60" cy="40" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="120" cy="20" r="1" fill="white" opacity="0.5"/>
  <circle cx="200" cy="50" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="340" cy="25" r="1" fill="white" opacity="0.6"/>
  <circle cx="460" cy="35" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="580" cy="18" r="1" fill="white" opacity="0.4"/>
  <circle cx="700" cy="42" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="760" cy="26" r="1" fill="white" opacity="0.5"/>

  <!-- Grid lines subtle -->
  <g opacity="0.025" stroke="white" stroke-width="0.8">
    <line x1="0" y1="120" x2="800" y2="120"/><line x1="0" y1="240" x2="800" y2="240"/><line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="100" y1="0" x2="100" y2="480"/><line x1="200" y1="0" x2="200" y2="480"/><line x1="300" y1="0" x2="300" y2="480"/>
    <line x1="400" y1="0" x2="400" y2="480"/><line x1="500" y1="0" x2="500" y2="480"/><line x1="600" y1="0" x2="600" y2="480"/><line x1="700" y1="0" x2="700" y2="480"/>
  </g>

  <!-- Ground / lawn -->
  <rect x="0" y="390" width="800" height="90" fill="#0a1628"/>
  <rect x="0" y="388" width="800" height="8" rx="2" fill="#1a3c6e" opacity="0.4"/>
  <!-- Path -->
  <rect x="340" y="390" width="120" height="90" fill="rgba(232,160,32,0.08)"/>
  <line x1="400" y1="390" x2="400" y2="480" stroke="rgba(232,160,32,0.15)" stroke-width="2" stroke-dasharray="8 4"/>

  <!-- ── MAIN BUILDING ── -->
  <g filter="url(#sh6)">

    <!-- LEFT WING -->
    <rect x="80" y="230" width="160" height="180" rx="6" fill="url(#build)"/>
    <!-- Left wing roof -->
    <polygon points="60,230 160,155 280,230" fill="url(#roof)"/>
    <!-- Left wing windows row 1 -->
    <rect x="102" y="248" width="44" height="36" rx="4" fill="url(#win)"/>
    <rect x="158" y="248" width="44" height="36" rx="4" fill="url(#win)"/>
    <!-- Window frames -->
    <rect x="102" y="248" width="44" height="36" rx="4" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <rect x="158" y="248" width="44" height="36" rx="4" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <!-- Cross lines on windows -->
    <line x1="124" y1="248" x2="124" y2="284" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <line x1="102" y1="266" x2="146" y2="266" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <line x1="180" y1="248" x2="180" y2="284" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <line x1="158" y1="266" x2="202" y2="266" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <!-- Left wing windows row 2 -->
    <rect x="102" y="300" width="44" height="36" rx="4" fill="url(#win)"/>
    <rect x="158" y="300" width="44" height="36" rx="4" fill="rgba(37,84,160,0.15)"/>
    <line x1="124" y1="300" x2="124" y2="336" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <line x1="102" y1="318" x2="146" y2="318" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- MAIN BLOCK CENTER -->
    <rect x="220" y="170" width="360" height="250" rx="6" fill="url(#build)"/>
    <!-- Center roof / gabled -->
    <polygon points="180,170 400,60 620,170" fill="url(#roof)"/>
    <!-- Center decoration strip -->
    <rect x="220" y="170" width="360" height="12" fill="rgba(232,160,32,0.25)"/>

    <!-- Pillars front -->
    <rect x="248" y="200" width="18" height="220" rx="4" fill="rgba(255,255,255,0.06)"/>
    <rect x="294" y="200" width="18" height="220" rx="4" fill="rgba(255,255,255,0.06)"/>
    <rect x="488" y="200" width="18" height="220" rx="4" fill="rgba(255,255,255,0.06)"/>
    <rect x="534" y="200" width="18" height="220" rx="4" fill="rgba(255,255,255,0.06)"/>

    <!-- Main facade windows Row 1 -->
    <rect x="248" y="196" width="52" height="44" rx="5" fill="url(#win)"/>
    <rect x="322" y="196" width="52" height="44" rx="5" fill="url(#win)"/>
    <rect x="426" y="196" width="52" height="44" rx="5" fill="url(#win)"/>
    <rect x="500" y="196" width="52" height="44" rx="5" fill="url(#win)"/>
    <!-- Window frames -->
    <rect x="248" y="196" width="52" height="44" rx="5" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
    <rect x="322" y="196" width="52" height="44" rx="5" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
    <rect x="426" y="196" width="52" height="44" rx="5" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
    <rect x="500" y="196" width="52" height="44" rx="5" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>

    <!-- Row 2 windows -->
    <rect x="248" y="260" width="52" height="44" rx="5" fill="url(#win)"/>
    <rect x="322" y="260" width="52" height="44" rx="5" fill="rgba(37,84,160,0.15)"/>
    <rect x="426" y="260" width="52" height="44" rx="5" fill="url(#win)"/>
    <rect x="500" y="260" width="52" height="44" rx="5" fill="url(#win)"/>

    <!-- Signboard / banner -->
    <rect x="275" y="334" width="250" height="36" rx="8" fill="url(#sign)" filter="url(#sh6)"/>
    <rect x="277" y="336" width="246" height="32" rx="7" fill="url(#sign)"/>
    <text x="400" y="356" text-anchor="middle" font-size="13" fill="#0a1628" font-family="Inter,sans-serif" font-weight="900" letter-spacing="1">THE BRAIN COLLEGE</text>

    <!-- Main entrance door -->
    <rect x="358" y="344" width="84" height="80" rx="8" fill="#0a1628"/>
    <rect x="364" y="350" width="72" height="74" rx="6" fill="#1a3c6e" opacity="0.6"/>
    <rect x="364" y="350" width="72" height="74" rx="6" fill="url(#win)" opacity="0.5"/>
    <!-- Door arch -->
    <path d="M358 370 Q400 340 442 370" fill="#0a1628"/>
    <!-- Door handle -->
    <circle cx="400" cy="388" r="4" fill="#e8a020" opacity="0.8"/>
    <!-- Door steps -->
    <rect x="346" y="420" width="108" height="8" rx="3" fill="rgba(232,160,32,0.15)"/>
    <rect x="352" y="414" width="96" height="8" rx="3" fill="rgba(232,160,32,0.10)"/>

    <!-- RIGHT WING -->
    <rect x="560" y="230" width="160" height="180" rx="6" fill="url(#build)"/>
    <!-- Right wing roof -->
    <polygon points="520,230 640,155 740,230" fill="url(#roof)"/>
    <!-- Right wing windows -->
    <rect x="580" y="248" width="44" height="36" rx="4" fill="url(#win)"/>
    <rect x="636" y="248" width="44" height="36" rx="4" fill="url(#win)"/>
    <rect x="580" y="300" width="44" height="36" rx="4" fill="rgba(37,84,160,0.15)"/>
    <rect x="636" y="300" width="44" height="36" rx="4" fill="url(#win)"/>
    <rect x="580" y="248" width="44" height="36" rx="4" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <rect x="636" y="248" width="44" height="36" rx="4" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <line x1="602" y1="248" x2="602" y2="284" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <line x1="580" y1="266" x2="624" y2="266" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <line x1="658" y1="248" x2="658" y2="284" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <line x1="636" y1="266" x2="680" y2="266" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  </g>

  <!-- Flag pole -->
  <line x1="400" y1="60" x2="400" y2="0" stroke="#e8a020" stroke-width="2.5"/>
  <!-- Flag -->
  <rect x="400" y="4" width="48" height="30" rx="3" fill="#e8a020"/>
  <text x="424" y="24" text-anchor="middle" font-size="11" fill="#0a1628" font-family="Inter,sans-serif" font-weight="900">BC</text>

  <!-- Trees on sides -->
  <g>
    <!-- Left trees -->
    <rect x="30" y="350" width="12" height="50" rx="4" fill="#0a1628"/>
    <ellipse cx="36" cy="336" rx="26" ry="32" fill="#0f2444"/>
    <ellipse cx="36" cy="326" rx="20" ry="24" fill="#1a3c6e" opacity="0.7"/>
    <rect x="72" y="360" width="10" height="40" rx="3" fill="#0a1628"/>
    <ellipse cx="77" cy="348" rx="22" ry="26" fill="#0f2444"/>
    <ellipse cx="77" cy="340" rx="16" ry="18" fill="#1a3c6e" opacity="0.6"/>
    <!-- Right trees -->
    <rect x="748" y="350" width="12" height="50" rx="4" fill="#0a1628"/>
    <ellipse cx="754" cy="336" rx="26" ry="32" fill="#0f2444"/>
    <ellipse cx="754" cy="326" rx="20" ry="24" fill="#1a3c6e" opacity="0.7"/>
    <rect x="710" y="360" width="10" height="40" rx="3" fill="#0a1628"/>
    <ellipse cx="715" cy="348" rx="22" ry="26" fill="#0f2444"/>
    <ellipse cx="715" cy="340" rx="16" ry="18" fill="#1a3c6e" opacity="0.6"/>
  </g>

  <!-- Gate pillars -->
  <rect x="280" y="400" width="20" height="50" rx="4" fill="#0f2444"/>
  <rect x="500" y="400" width="20" height="50" rx="4" fill="#0f2444"/>
  <rect x="278" y="396" width="24" height="8" rx="3" fill="#e8a020" opacity="0.6"/>
  <rect x="498" y="396" width="24" height="8" rx="3" fill="#e8a020" opacity="0.6"/>

  <!-- Ground reflection/shadow -->
  <ellipse cx="400" cy="395" rx="300" ry="20" fill="rgba(26,60,110,0.2)"/>
</svg>
