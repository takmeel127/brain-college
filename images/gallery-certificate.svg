<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" fill="none">
  <defs>
    <linearGradient id="certbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0a1628"/><stop offset="100%" stop-color="#1a3c6e"/></linearGradient>
    <linearGradient id="certgold" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#e8a020"/><stop offset="100%" stop-color="#f5bc50"/></linearGradient>
    <linearGradient id="certpaper" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fffef8"/><stop offset="100%" stop-color="#f5f0e0"/></linearGradient>
    <filter id="cert_sf" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#050d1a" flood-opacity="0.45"/></filter>
    <filter id="glow_cert"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- Dark background with bokeh -->
  <rect width="480" height="360" fill="url(#certbg)"/>
  <!-- Bokeh circles -->
  <circle cx="60" cy="80" r="40" fill="rgba(232,160,32,0.06)"/>
  <circle cx="420" cy="280" r="50" fill="rgba(37,84,160,0.08)"/>
  <circle cx="400" cy="60" r="30" fill="rgba(232,160,32,0.05)"/>
  <circle cx="80" cy="300" r="35" fill="rgba(37,84,160,0.06)"/>
  <!-- Grid bg -->
  <g opacity="0.03" stroke="white" stroke-width="0.8">
    <line x1="0" y1="90" x2="480" y2="90"/><line x1="0" y1="180" x2="480" y2="180"/><line x1="0" y1="270" x2="480" y2="270"/>
    <line x1="96" y1="0" x2="96" y2="360"/><line x1="192" y1="0" x2="192" y2="360"/><line x1="288" y1="0" x2="288" y2="360"/><line x1="384" y1="0" x2="384" y2="360"/>
  </g>

  <!-- ── MAIN CERTIFICATE ── -->
  <g filter="url(#cert_sf)" transform="translate(50, 40)">
    <!-- Certificate paper -->
    <rect width="380" height="280" rx="12" fill="url(#certpaper)"/>
    <!-- Border outer gold -->
    <rect width="380" height="280" rx="12" fill="none" stroke="#e8a020" stroke-width="4"/>
    <!-- Border inner double -->
    <rect x="10" y="10" width="360" height="260" rx="8" fill="none" stroke="#e8a020" stroke-width="1.5"/>
    <rect x="14" y="14" width="352" height="252" rx="6" fill="none" stroke="rgba(232,160,32,0.3)" stroke-width="0.8"/>

    <!-- Corner ornaments -->
    <g fill="#e8a020" opacity="0.7">
      <!-- TL -->
      <path d="M10 10 L10 30 L14 30 L14 14 L30 14 L30 10Z"/>
      <circle cx="10" cy="10" r="4"/>
      <!-- TR -->
      <path d="M370 10 L370 30 L366 30 L366 14 L350 14 L350 10Z"/>
      <circle cx="370" cy="10" r="4"/>
      <!-- BL -->
      <path d="M10 270 L10 250 L14 250 L14 266 L30 266 L30 270Z"/>
      <circle cx="10" cy="270" r="4"/>
      <!-- BR -->
      <path d="M370 270 L370 250 L366 250 L366 266 L350 266 L350 270Z"/>
      <circle cx="370" cy="270" r="4"/>
    </g>

    <!-- Header: College name -->
    <text x="190" y="38" text-anchor="middle" font-size="11" fill="#1a3c6e" font-family="Playfair Display,Georgia,serif" font-weight="700" letter-spacing="1">THE BRAIN COLLEGE BHAKKAR</text>
    <line x1="40" y1="44" x2="340" y2="44" stroke="#e8a020" stroke-width="1.5"/>

    <!-- "Certificate of Completion" -->
    <text x="190" y="68" text-anchor="middle" font-size="20" fill="#1a3c6e" font-family="Playfair Display,Georgia,serif" font-weight="700" letter-spacing="1">Certificate</text>
    <text x="190" y="86" text-anchor="middle" font-size="11" fill="#6b7280" font-family="Inter,sans-serif" letter-spacing="3">OF COMPLETION</text>

    <!-- This certifies line -->
    <text x="190" y="112" text-anchor="middle" font-size="9" fill="#9ca3af" font-family="Inter,sans-serif" font-style="italic">This is to certify that</text>

    <!-- Student name line -->
    <line x1="60" y1="132" x2="320" y2="132" stroke="#1a3c6e" stroke-width="1.5"/>
    <text x="190" y="128" text-anchor="middle" font-size="18" fill="#1a3c6e" font-family="Playfair Display,Georgia,serif" font-weight="700">Muhammad Ali</text>

    <!-- Course text -->
    <text x="190" y="148" text-anchor="middle" font-size="9" fill="#9ca3af" font-family="Inter,sans-serif" font-style="italic">has successfully completed the course of</text>
    <text x="190" y="168" text-anchor="middle" font-size="14" fill="#e8a020" font-family="Playfair Display,Georgia,serif" font-weight="700">Computer Application</text>
    <line x1="80" y1="174" x2="300" y2="174" stroke="rgba(232,160,32,0.3)" stroke-width="1"/>

    <!-- Duration -->
    <text x="190" y="190" text-anchor="middle" font-size="9" fill="#9ca3af" font-family="Inter,sans-serif">Duration: 6 Months  |  August 2026</text>

    <!-- Seal and signatures area -->
    <!-- Seal circle left -->
    <circle cx="90" cy="236" r="28" fill="none" stroke="#e8a020" stroke-width="2"/>
    <circle cx="90" cy="236" r="22" fill="rgba(232,160,32,0.06)"/>
    <text x="90" y="230" text-anchor="middle" font-size="18" fill="#e8a020" font-family="Playfair Display,serif">B</text>
    <text x="90" y="244" text-anchor="middle" font-size="7" fill="#1a3c6e" font-family="Inter,sans-serif" font-weight="700">BRAIN COLLEGE</text>
    <text x="90" y="253" text-anchor="middle" font-size="6" fill="#6b7280" font-family="Inter,sans-serif">BHAKKAR</text>

    <!-- Signature lines -->
    <g>
      <!-- Left signature -->
      <path d="M148 246 Q165 238 182 246" stroke="#1a3c6e" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <line x1="148" y1="248" x2="182" y2="248" stroke="#e5e7eb" stroke-width="1"/>
      <text x="165" y="260" text-anchor="middle" font-size="7" fill="#6b7280" font-family="Inter,sans-serif">Director</text>

      <!-- Right signature -->
      <path d="M218 244 Q240 236 262 244" stroke="#1a3c6e" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <line x1="218" y1="248" x2="262" y2="248" stroke="#e5e7eb" stroke-width="1"/>
      <text x="240" y="260" text-anchor="middle" font-size="7" fill="#6b7280" font-family="Inter,sans-serif">Instructor</text>

      <!-- Right seal -->
      <circle cx="310" cy="236" r="22" fill="none" stroke="#e8a020" stroke-width="1.5" stroke-dasharray="4 2"/>
      <text x="310" y="241" text-anchor="middle" font-size="18" fill="#e8a020">★</text>
    </g>
  </g>

  <!-- Gold ribbon top center -->
  <g filter="url(#glow_cert)">
    <rect x="220" y="18" width="40" height="52" rx="4" fill="url(#certgold)" opacity="0.9"/>
    <polygon points="220,68 240,80 260,68" fill="#c07010"/>
    <circle cx="240" cy="36" r="10" fill="#c07010"/>
    <text x="240" y="40" text-anchor="middle" font-size="10" fill="#f5bc50">★</text>
  </g>

  <!-- Small decorative gold sparkles -->
  <g fill="#e8a020" opacity="0.5">
    <text x="36" y="50" font-size="12">✦</text>
    <text x="436" y="50" font-size="12">✦</text>
    <text x="36" y="320" font-size="12">✦</text>
    <text x="436" y="320" font-size="12">✦</text>
    <text x="236" y="346" font-size="14">✦</text>
  </g>
</svg>
