<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" fill="none">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f2444"/><stop offset="100%" stop-color="#1a3c6e"/></linearGradient>
    <linearGradient id="scr2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0d1b2e"/><stop offset="100%" stop-color="#1a3c6e"/></linearGradient>
    <linearGradient id="sk2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#c8845a"/><stop offset="100%" stop-color="#b06840"/></linearGradient>
    <linearGradient id="sh2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1a3c6e"/><stop offset="100%" stop-color="#2554a0"/></linearGradient>
    <filter id="shd2" x="-15%" y="-15%" width="130%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#050d1a" flood-opacity="0.4"/></filter>
  </defs>

  <rect width="400" height="320" fill="url(#bg2)"/>
  <rect x="0" y="250" width="400" height="70" fill="#0a1628"/>
  <rect x="0" y="248" width="400" height="3" fill="#1a3c6e" opacity="0.5"/>
  <g opacity="0.04" stroke="white" stroke-width="0.5">
    <line x1="0" y1="80" x2="400" y2="80"/><line x1="0" y1="160" x2="400" y2="160"/><line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="80" y1="0" x2="80" y2="320"/><line x1="160" y1="0" x2="160" y2="320"/><line x1="240" y1="0" x2="240" y2="320"/><line x1="320" y1="0" x2="320" y2="320"/>
  </g>

  <!-- Desk -->
  <rect x="55" y="218" width="290" height="14" rx="4" fill="#1e3a5f" filter="url(#shd2)"/>
  <rect x="40" y="230" width="320" height="6" rx="3" fill="#0f2444"/>
  <rect x="76" y="236" width="10" height="70" rx="3" fill="#0f2444"/>
  <rect x="314" y="236" width="10" height="70" rx="3" fill="#0f2444"/>

  <!-- Two monitors side by side -->
  <g filter="url(#shd2)">
    <!-- Left monitor -->
    <rect x="60" y="108" width="155" height="118" rx="10" fill="#0d1b2e"/>
    <rect x="68" y="116" width="139" height="102" rx="7" fill="url(#scr2)"/>
    <rect x="68" y="116" width="139" height="102" rx="7" fill="rgba(37,84,160,0.18)"/>
    <!-- Excel spreadsheet look -->
    <rect x="68" y="116" width="139" height="16" rx="7" fill="rgba(37,84,160,0.3)"/>
    <text x="76" y="128" font-size="8" fill="rgba(255,255,255,0.7)" font-family="Inter,sans-serif">Microsoft Excel</text>
    <!-- Table grid -->
    <g stroke="rgba(255,255,255,0.08)" stroke-width="0.8">
      <line x1="68" y1="148" x2="207" y2="148"/>
      <line x1="68" y1="162" x2="207" y2="162"/>
      <line x1="68" y1="176" x2="207" y2="176"/>
      <line x1="68" y1="190" x2="207" y2="190"/>
      <line x1="68" y1="204" x2="207" y2="204"/>
      <line x1="108" y1="132" x2="108" y2="218"/>
      <line x1="148" y1="132" x2="148" y2="218"/>
      <line x1="180" y1="132" x2="180" y2="218"/>
    </g>
    <!-- Cell highlight -->
    <rect x="109" y="163" width="38" height="13" rx="1" fill="rgba(37,84,160,0.4)" stroke="#2554a0" stroke-width="1"/>
    <!-- Cell data -->
    <rect x="72" y="135" width="32" height="7" rx="2" fill="rgba(255,255,255,0.22)"/>
    <rect x="72" y="150" width="28" height="6" rx="2" fill="rgba(255,255,255,0.12)"/>
    <rect x="72" y="164" width="30" height="6" rx="2" fill="rgba(255,255,255,0.12)"/>
    <rect x="72" y="178" width="25" height="6" rx="2" fill="rgba(255,255,255,0.12)"/>
    <rect x="72" y="192" width="32" height="6" rx="2" fill="rgba(255,255,255,0.12)"/>
    <rect x="112" y="135" width="22" height="7" rx="2" fill="#e8a020" opacity="0.5"/>
    <rect x="152" y="135" width="22" height="7" rx="2" fill="rgba(255,255,255,0.15)"/>
    <rect x="184" y="135" width="18" height="7" rx="2" fill="rgba(255,255,255,0.12)"/>
    <!-- Stand -->
    <rect x="128" y="226" width="20" height="16" rx="3" fill="#0d1b2e"/>
    <rect x="116" y="240" width="44" height="6" rx="3" fill="#0a1628"/>

    <!-- Right monitor -->
    <rect x="225" y="96" width="155" height="130" rx="10" fill="#0d1b2e"/>
    <rect x="233" y="104" width="139" height="114" rx="7" fill="url(#scr2)"/>
    <rect x="233" y="104" width="139" height="114" rx="7" fill="rgba(37,84,160,0.15)"/>
    <!-- Charts on right monitor -->
    <rect x="233" y="104" width="139" height="16" rx="7" fill="rgba(255,255,255,0.05)"/>
    <text x="242" y="116" font-size="8" fill="rgba(255,255,255,0.7)" font-family="Inter,sans-serif">Analytics</text>
    <!-- Bar chart -->
    <rect x="244" y="160" width="14" height="44" rx="3" fill="#e8a020" opacity="0.85"/>
    <rect x="264" y="148" width="14" height="56" rx="3" fill="#2554a0" opacity="0.9"/>
    <rect x="284" y="168" width="14" height="36" rx="3" fill="#e8a020" opacity="0.65"/>
    <rect x="304" y="154" width="14" height="50" rx="3" fill="#2554a0" opacity="0.75"/>
    <rect x="324" y="140" width="14" height="64" rx="3" fill="#10b981" opacity="0.8"/>
    <rect x="344" y="158" width="14" height="46" rx="3" fill="#e8a020" opacity="0.9"/>
    <!-- Axis -->
    <line x1="240" y1="206" x2="366" y2="206" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
    <!-- Line chart overlay -->
    <path d="M244 174 L264 162 L284 178 L304 165 L324 148 L344 168" stroke="#f5bc50" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Dots on line -->
    <circle cx="244" cy="174" r="3" fill="#f5bc50"/>
    <circle cx="264" cy="162" r="3" fill="#f5bc50"/>
    <circle cx="284" cy="178" r="3" fill="#f5bc50"/>
    <circle cx="304" cy="165" r="3" fill="#f5bc50"/>
    <circle cx="324" cy="148" r="3" fill="#f5bc50"/>
    <circle cx="344" cy="168" r="3" fill="#f5bc50"/>
    <!-- Stand -->
    <rect x="295" y="226" width="20" height="16" rx="3" fill="#0d1b2e"/>
    <rect x="283" y="240" width="44" height="6" rx="3" fill="#0a1628"/>
  </g>

  <!-- Keyboard -->
  <rect x="90" y="216" width="130" height="8" rx="4" fill="#1a2a44"/>
  <rect x="240" y="216" width="110" height="8" rx="4" fill="#1a2a44"/>
  <!-- Mouse -->
  <rect x="228" y="214" width="16" height="11" rx="5" fill="#1a2a44"/>

  <!-- ── BOY STUDENT ── -->
  <g filter="url(#shd2)">
    <!-- Chair -->
    <rect x="164" y="162" width="48" height="88" rx="8" fill="#0f2444"/>
    <rect x="160" y="234" width="56" height="8" rx="4" fill="#0d1b2e"/>
    <!-- Body -->
    <rect x="155" y="178" width="66" height="72" rx="10" fill="url(#sh2)"/>
    <!-- Collar detail -->
    <path d="M179 178 L188 178 L188 196 L179 196Z" fill="white" opacity="0.9"/>
    <!-- Neck -->
    <rect x="179" y="165" width="18" height="18" rx="6" fill="url(#sk2)"/>
    <!-- Head -->
    <ellipse cx="188" cy="152" rx="25" ry="27" fill="url(#sk2)"/>
    <!-- Hair black short -->
    <path d="M163 142 Q166 122 188 120 Q210 122 213 142 Q210 128 188 126 Q166 128 163 142Z" fill="#1a0a00"/>
    <!-- Sideburns -->
    <rect x="163" y="142" width="5" height="14" rx="2" fill="#1a0a00"/>
    <rect x="208" y="142" width="5" height="14" rx="2" fill="#1a0a00"/>
    <!-- Eyes focused/looking at screen -->
    <ellipse cx="181" cy="148" rx="4" ry="4.5" fill="#1a1a1a"/>
    <ellipse cx="195" cy="148" rx="4" ry="4.5" fill="#1a1a1a"/>
    <circle cx="182.5" cy="146.5" r="1.4" fill="white"/>
    <circle cx="196.5" cy="146.5" r="1.4" fill="white"/>
    <!-- Eyebrows -->
    <path d="M177 140 Q181 137 185 140" stroke="#1a0a00" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M191 140 Q195 137 199 140" stroke="#1a0a00" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Nose -->
    <path d="M186 154 Q188 158 190 154" stroke="rgba(0,0,0,0.22)" stroke-width="1.3" fill="none"/>
    <!-- Focused expression - slight smile -->
    <path d="M183 163 Q188 167 193 163" stroke="rgba(0,0,0,0.25)" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <!-- Arms -->
    <rect x="142" y="196" width="20" height="42" rx="8" fill="url(#sh2)"/>
    <rect x="214" y="196" width="20" height="42" rx="8" fill="url(#sh2)"/>
    <ellipse cx="152" cy="242" rx="12" ry="7" fill="url(#sk2)"/>
    <ellipse cx="224" cy="242" rx="12" ry="7" fill="url(#sk2)"/>
  </g>

  <!-- Floating card -->
  <g filter="url(#shd2)" transform="translate(252, 14)">
    <rect width="132" height="62" rx="12" fill="white" opacity="0.96"/>
    <rect x="12" y="12" width="24" height="24" rx="7" fill="rgba(26,60,110,0.10)"/>
    <text x="24" y="28" text-anchor="middle" font-size="14">📊</text>
    <text x="44" y="22" font-size="9" fill="#6b7280" font-family="Inter,sans-serif">Male Section</text>
    <text x="44" y="34" font-size="11" fill="#1a3c6e" font-family="Inter,sans-serif" font-weight="700">Computer Lab</text>
    <text x="44" y="46" font-size="9" fill="#e8a020" font-family="Inter,sans-serif">★ Advanced Training</text>
  </g>

  <!-- Glow under screens -->
  <ellipse cx="140" cy="118" rx="60" ry="15" fill="rgba(37,84,160,0.12)"/>
  <ellipse cx="302" cy="106" rx="60" ry="15" fill="rgba(37,84,160,0.12)"/>
</svg>
