<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — The Brain College Bhakkar</title>
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>

<div class="login-page">
  <!-- Floating decoration circles -->
  <div style="position:absolute;width:400px;height:400px;border-radius:50%;background:rgba(37,84,160,0.08);top:-100px;right:-100px;pointer-events:none;"></div>
  <div style="position:absolute;width:300px;height:300px;border-radius:50%;background:rgba(232,160,32,0.06);bottom:-80px;left:-80px;pointer-events:none;"></div>

  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon"><img src="../images/logo.jpg" alt="Brain College Logo" style="width:100%;height:100%;object-fit:cover;border-radius:18px;"></div>
      <div class="login-title">Admin Panel</div>
      <div class="login-sub">The Brain College Bhakkar</div>
    </div>

    <form id="adminLoginForm" autocomplete="off">
      <div id="loginError" style="display:none;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.20);border-radius:8px;padding:10px 14px;font-size:0.82rem;color:#991b1b;margin-bottom:16px;"></div>

      <div class="form-group">
        <label class="form-label" for="loginUsername">Username</label>
        <div class="login-input-wrap">
          <i class="fas fa-user"></i>
          <input type="text" id="loginUsername" class="form-control" placeholder="Enter username" value="admin" autocomplete="off">
        </div>
      </div>

      <div class="form-group" style="margin-bottom:20px;">
        <label class="form-label" for="loginPassword">Password</label>
        <div class="login-input-wrap">
          <i class="fas fa-lock"></i>
          <input type="password" id="loginPassword" class="form-control" placeholder="Enter password" value="brain2026">
          <i class="fas fa-eye login-toggle-pw"></i>
        </div>
      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
        <label style="display:flex;align-items:center;gap:8px;font-size:0.82rem;color:var(--gray-600);cursor:pointer;">
          <input type="checkbox" checked style="accent-color:var(--admin-primary);"> Remember me
        </label>
        <a href="#" style="font-size:0.82rem;color:var(--admin-primary);font-weight:500;">Forgot password?</a>
      </div>

      <button type="submit" class="login-submit">
        <i class="fas fa-sign-in-alt"></i> Sign In to Admin Panel
      </button>
    </form>

    <div class="login-demo-creds">
      <strong>Demo Credentials:</strong><br>
      Username: <strong>admin</strong> &nbsp;|&nbsp; Password: <strong>brain2026</strong>
    </div>

    <div style="text-align:center;margin-top:20px;">
      <a href="../index.html" style="font-size:0.8rem;color:var(--gray-400);display:inline-flex;align-items:center;gap:6px;transition:color 0.2s;" onmouseover="this.style.color='var(--admin-primary)'" onmouseout="this.style.color='var(--gray-400)'">
        <i class="fas fa-arrow-left"></i> Back to Website
      </a>
    </div>
  </div>
</div>

<script src="../js/admin.js"></script>
</body>
</html>
